<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Between Us — a shelf of writings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --grey-0:#242427;
    --grey-1:#2b2b2f;
    --grey-2:#38383d;
    --grey-3:#4a4a51;
    --ink:#e9e6df;
    --ink-dim:#9c9a97;
    --gold:#c8a45c;
    --gold-dim:#8d7644;
    --blue:#6f9bc9;
    --paper:#f4efe4;
    --paper-shadow:#d8cdb2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--grey-0);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{background:var(--gold-dim); color:var(--paper);}

  /* subtle ambient grain / vignette so the flat grey has depth */
  #bg-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.45), transparent 60%);
  }

  /* ---------------- SHELF VIEW ---------------- */
  #shelf-view{
    position:relative; z-index:1;
    height:100%; width:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:7vh 6vw 4vh;
    transition:opacity .5s ease, filter .5s ease;
  }
  #shelf-view.hidden{opacity:0; pointer-events:none;}

  .site-eyebrow{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--gold); margin-bottom:10px;
  }
  .site-title{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:clamp(28px,7vw,40px); margin:0 0 6px;
    color:var(--ink); text-align:center; letter-spacing:.01em;
  }
  .site-sub{
    font-family:'Inter',sans-serif; font-size:13px; color:var(--ink-dim);
    text-align:center; max-width:320px; line-height:1.6; margin-bottom:6vh;
  }

  .shelf-scroll{
    width:100%; max-width:640px; overflow-y:auto; flex:1;
    padding-bottom:4vh;
  }
  .shelf-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:28px 22px;
    width:100%;
  }

  .book-slot{ display:flex; flex-direction:column; align-items:center; }
  .book-slot-label{
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--ink-dim);
    margin-top:12px; text-align:center; line-height:1.4; max-width:130px;
  }
  .book-slot-label b{ color:var(--ink); font-weight:500; display:block; font-size:12.5px; margin-bottom:2px;}

  /* real book cover */
  .book-cover{
    position:relative; width:120px; aspect-ratio:900/1279;
    border-radius:2px 5px 5px 2px;
    cursor:pointer; background:#000;
    box-shadow:
      -2px 0 0 0 #cbbfa0,
      -4px 2px 6px -2px rgba(0,0,0,.5),
      0 10px 18px -6px rgba(0,0,0,.65);
    transition:transform .35s cubic-bezier(.22,.9,.35,1), box-shadow .35s ease;
  }
  .book-cover img{
    width:100%; height:100%; object-fit:cover; display:block;
    border-radius:2px 5px 5px 2px;
  }
  .book-cover::after{
    content:""; position:absolute; inset:0; border-radius:2px 5px 5px 2px;
    box-shadow: inset 3px 0 4px rgba(0,0,0,.35);
  }
  .book-slot:hover .book-cover{
    transform:translateY(-4px) rotate(-1deg);
    box-shadow:
      -2px 0 0 0 #cbbfa0,
      -4px 2px 6px -2px rgba(0,0,0,.5),
      0 16px 26px -8px rgba(0,0,0,.7);
  }
  .book-cover:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; }

  /* ghost / invisible placeholder book */
  .book-ghost{
    width:120px; aspect-ratio:900/1279;
    border-radius:2px 5px 5px 2px;
    border:1.5px dashed rgba(233,230,223,.16);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:border-color .3s ease, background .3s ease;
  }
  .book-ghost::before{ /* spine hint */
    content:""; position:absolute; left:6px; top:6px; bottom:6px;
    width:1px; background:rgba(233,230,223,.12);
  }
  .book-ghost .plus{
    font-family:'Inter',sans-serif; font-size:20px; font-weight:400;
    color:rgba(233,230,223,.25); transition:color .3s ease;
  }
  .book-slot.empty:hover .book-ghost{
    border-color:rgba(200,164,92,.45);
    background:rgba(200,164,92,.04);
  }
  .book-slot.empty:hover .plus{ color:var(--gold); }
  .book-slot.empty .book-slot-label{ opacity:.55; }

  /* ---------------- ZOOM TRANSITION GHOST ---------------- */
  #zoom-ghost{
    position:fixed; z-index:50; pointer-events:none;
    border-radius:2px 5px 5px 2px; overflow:hidden;
    box-shadow:0 30px 60px -12px rgba(0,0,0,.6);
    opacity:0;
  }
  #zoom-ghost img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------------- READER VIEW ---------------- */
  #reader-view{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .4s ease;
  }
  #reader-view.active{ opacity:1; pointer-events:auto; }

  .reader-topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; z-index:5;
    font-family:'Inter',sans-serif;
  }
  .reader-title-chip{
    font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-dim);
  }
  .close-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--grey-3);
    background:var(--grey-1); color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; line-height:1;
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .close-btn:hover{ background:var(--grey-2); color:var(--ink); transform:rotate(90deg); }

  .book-stage-wrap{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .book-stage{
    position:relative;
    width:340px; height:498px;
    transform-origin:center center;
  }

  .book-3d{
    position:relative; width:100%; height:100%;
    perspective:1800px;
  }

  /* base page beneath the flipping leaf (shows current content instantly) */
  .page-base{
    position:absolute; inset:0;
    background:var(--paper);
    border-radius:3px;
    box-shadow:0 24px 50px -10px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.2);
    overflow:hidden;
  }

  /* stacked leaf-edge indicators: remaining pages (right) & read pages (left) */
  .edge-stack{
    position:absolute; top:6px; bottom:6px; width:10px; pointer-events:none;
  }
  .edge-stack.right{ right:-4px; border-radius:0 3px 3px 0; }
  .edge-stack.left{ left:-4px; border-radius:3px 0 0 3px; }
  .edge-stack span{
    position:absolute; left:0; right:0; top:0; bottom:0;
    background:linear-gradient(90deg, var(--paper-shadow), #c3b48c);
    border-radius:inherit;
  }

  .page-content{
    position:absolute; inset:0;
    padding:38px 26px 34px;
    display:flex; flex-direction:column;
    font-family:'Source Serif 4', serif;
    color:#26231c;
  }
  .page-content .running-head{
    font-family:'Inter',sans-serif; font-size:8.5px; letter-spacing:.16em;
    text-transform:uppercase; color:#a99a7c; text-align:center; margin-bottom:16px;
  }
  .page-content .ptext{
    font-size:12.6px; line-height:1.62; text-align:justify;
    flex:1; overflow:hidden;
  }
  .page-content .ptext p{ margin:0 0 10px; text-indent:14px; }
  .page-content .ptext p.noindent{ text-indent:0; }
  .page-content .ptext p.center{ text-align:center; text-indent:0; }
  .page-content .ptext p.italic{ font-style:italic; }
  .page-content .pnum{
    font-family:'Inter',sans-serif; font-size:9px; color:#a99a7c;
    text-align:center; margin-top:8px;
  }
  .title-page{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center;
  }
  .title-page .eyebrow{ font-family:'Inter',sans-serif; font-size:9px; letter-spacing:.2em; color:var(--gold-dim); text-transform:uppercase; margin-bottom:14px;}
  .title-page h1{
    font-family:'Fraunces',serif; font-weight:600; font-style:italic;
    font-size:26px; margin:0 0 10px; color:#26231c; line-height:1.15;
  }
  .title-page p{ font-family:'Source Serif 4', serif; font-style:italic; font-size:12px; color:#5b543f; max-width:220px; margin:0 0 20px;}
  .title-page .by{ font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.06em; color:#8a7f5e; }

  /* the flipping leaf: single full page, hinged at the left (spine) edge */
  .leaf{
    position:absolute; top:0; bottom:0; left:0; width:100%;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform .7s cubic-bezier(.55,.06,.27,1.1);
    z-index:10;
  }
  .leaf .face{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--paper); border-radius:3px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4);
    overflow:hidden;
  }
  .leaf .face.back{ transform:rotateY(180deg); }
  .leaf.flip{ transform:rotateY(-180deg); }
  .leaf.flip-back{ transform:rotateY(180deg); }

  .reader-controls{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:26px;
    padding:20px 0 26px;
  }
  .nav-btn{
    width:42px; height:42px; border-radius:50%;
    background:var(--grey-1); border:1px solid var(--grey-3);
    color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; transition:background .2s ease, opacity .2s ease, transform .15s ease;
  }
  .nav-btn:hover:not(:disabled){ background:var(--grey-2); transform:translateY(-1px); }
  .nav-btn:disabled{ opacity:.25; cursor:default; }
  .page-indicator{
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--ink-dim);
    min-width:64px; text-align:center; letter-spacing:.03em;
  }

  @media (max-width:400px){
    .book-stage{ width:300px; height:440px; }
  }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div id="bg-vignette"></div>

<!-- SHELF -->
<section id="shelf-view">
  <div class="site-eyebrow">a growing shelf</div>
  <h1 class="site-title">Between Us</h1>
  <p class="site-sub">Personal writings on faith, borders, and the people met along the way. Tap a cover to open it.</p>

  <div class="shelf-scroll">
    <div class="shelf-grid" id="shelf-grid"></div>
  </div>
</section>

<!-- ZOOM TRANSITION GHOST -->
<div id="zoom-ghost"><img id="zoom-ghost-img" alt=""></div>

<!-- READER -->
<section id="reader-view" aria-hidden="true">
  <div class="reader-topbar">
    <span class="reader-title-chip" id="reader-title-chip">Between You and Me</span>
    <button class="close-btn" id="close-btn" aria-label="Close book">&#10005;</button>
  </div>

  <div class="book-stage-wrap">
    <div class="book-stage" id="book-stage">
      <div class="book-3d" id="book-3d">
        <div class="page-base" id="page-base">
          <div class="edge-stack right" id="edge-right"></div>
          <div class="edge-stack left" id="edge-left"></div>
          <div class="page-content" id="page-content-base"></div>
        </div>
        <div class="leaf" id="leaf">
          <div class="face front page-content" id="leaf-front"></div>
          <div class="face back page-content" id="leaf-back"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="reader-controls">
    <button class="nav-btn" id="prev-btn" aria-label="Previous page">&#8249;</button>
    <span class="page-indicator" id="page-indicator">1 / 1</span>
    <button class="nav-btn" id="next-btn" aria-label="Next page">&#8250;</button>
  </div>
</section>

AhUOksLq4rb2XBWEsko83FcQip4HOe7hAC8ygxmKQAtka4eBWRmLDBV0ckeo4hbQrQGZaxKhdxU1Y4AHYkLjau++qxbY5ReprrnHl8nUaarjkGhF1ltcCub0FZilK4NnDH25hy2jDcWdIBxtIVijWqfD4ZrsocexsQRWIJ2vAIV4G6vpplZrBZqCQ0kLQO0LFqyko3GBzVv1V8BXL+051qRwBXK6vZKFEmmXNFFSsWTn9didZWaTSXHQLCRF8+lKUnmTPSJJcIIiLEk//2Q==", "title": "Between You and Me", "subtitle": "a reflection on faith, friendship, and crossing borders", "author": "Rex", "paragraphs": ["In a world full of boundaries — seas, mountains, long roads — we gain many differences from each other. Hi, I'm Rex, a born Christian in the Philippines, specifically from Manila. During the early years of my life I was exposed to Christianity; I even became a choir member in a Catholic church. I hadn't met a person who didn't believe in Christ until I turned 13 and transferred to Davao City. That's where I met people who don't believe in Christ, and I was a little scared at first because of the hood-like thing they wore over their hair — I mostly saw that in movies, where it was portrayed on people involved in terrorism and violence. By the way, I love action movies because my dad is a military officer who watched them during his free time with us, so whenever he put one on, I didn't have a choice but to watch it too, since we were scared of him (we were raised as disciplined children — we didn't ask much from our parents, not even to change the channel or put on a cartoon instead).", "Moving on — when I started the 2016 school year in Davao City (my 8th grade), it was my first time meeting people who wore that kind of hair covering. I'm an introvert, especially as a transferee, so I just observed everyone and talked very little in the first week of school. I noticed that the people who wore the hair covering still acted like normal people — they laughed, made jokes, smiled, and greeted me because I was the new student.", "I asked my seatmate Angie what that thing was that they were wearing. She told me, “Oh, that's a hijab.” I asked again, “A hijab? For what?” She answered, giggling, “It's a thing that Muslims wear.” That made me even more curious, but I stopped asking about it for the time being. After a week we were assigned to a group. I was grouped with two Muslim girls named Jas and Jamie, and I met a new friend named Ryan. I had a great time with Ryan — we talked about a lot of things because we were both gaming enthusiasts and followed famous YouTubers like PewDiePie, and he taught me a lot of Bisaya words since I didn't speak the local language, being from Manila. A little while later, I heard Jas and Jamie talking in a different language — not Tagalog, not Bisaya — and I whispered to Ryan, “Ryan, what are they talking about? It sounds like a different language.” Ryan replied, “Oh, it's because they're Muslims from the Tausug tribe.” My curiosity grew even more, and I said, “Huh? Tribes? We're living in a city, right?” Ryan laughed so hard: “HAHAHA, what do you mean? You thought a tribe was a place? It's a group of people, not a place.” I had assumed it was a place because of a childhood game I played with my older brother called “My Tribe” (you can look it up if you want) — a game where you develop, improve, and renovate your tribe, which is why I assumed a tribe was a settlement of people from some remote place. (Lol, sounds like I'm endorsing the game.) Anyway, after that loud laugh from Ryan, I was really embarrassed because my other groupmates heard it too, including Jas and Jamie, so I went quiet and put my head down. But Ryan called Jas and Jamie over — little did I know, Ryan was also Muslim, just from a different tribe: Maranao. I was shocked, because I'd assumed he was Christian like me since he wasn't wearing a hijab. (Silly me — I later found out hijabs are only worn by female Muslims.) Me, Ryan, Jas, and Jamie talked about a lot of things, and I learned that there are six recognized Moro (Muslim) tribes in Davao City: Kagan, Maguindanaon, Maranao, Tausug, Sama, and Iranun.", "Moving on — during the summer of 2017, my three other siblings and my mom moved to Davao as well, since the house that had been under construction was nearly finished. We're five siblings total: I have my Ate Roxanne, who was an Architecture student at FEU at the time, so she didn't move to Davao with my mom and the three other siblings. I also have Kuya Earl and B1 and B2 (B1 and B2 are twins, hence the nicknames). I'm the middle child. I was the first to move to Davao because our dad had been assigned there, and I was encouraged to stay with him — it was also my mother's hometown, and my dad had found it cheaper and safer to live in compared to Manila. When enrollment season came around, my mother found a school near our house to enroll B1 and B2 in. On enrollment day I went along with her, my dad, and B1 and B2, and they told me I should enroll there too, so I could live with them instead of at my grandmother's house. I told them, “I don't want to! I'll have to adjust all over again — I've been transferring schools since kindergarten, and I already made friends at my current school!” This would be my 7th school (going into grade 9), and I didn't want to make my dad angry — he was strict, and he physically disciplined us — so I had no choice but to agree. On my first day at the new school I had no one to talk to, again. I just leaned my head against the wall since I was sitting beside it. I wanted to talk to someone but couldn't, since most of them had been classmates since kindergarten — it was a small school with only one section per grade level, so they'd known each other for years. There was another transferee like me named Lawrence, a loud, extroverted guy and a basketball varsity player, so that explains the confidence (fun fact: I'd been bullied by varsity athletes before transferring to this school). I envied his confidence, since he was able to socialize with others even on our first day. I looked around the classroom and didn't see any girls wearing hijabs — it turned out there were no Muslim students in that class. That changed when I met Jimboi, who had this scary aura, like he looked dangerous, but he wasn't. I learned that his dad had been Muslim and his mom Catholic, and his dad converted to Catholicism when he married her — I didn't know that was even possible. I also met friends named Ralph, Rodnie, and Harold. Ralph was gentle, with an “older brother” vibe, and he taught me how to play guitar. Rodnie was a tall, tough-looking basketball varsity player too, but he was actually a softie and pretty quiet. Harold looked really, really scary — like he'd stab you if you offended him, lol — but he's actually a great guy. They became my best friends through high school and senior high, and still are today.", "That same year, our father brought us to a Mormon church, and night after night, two missionaries would visit our house to teach us the scriptures of Jesus Christ. It's almost the same as Catholicism, but Catholicism is such a big religion that every Sunday you'll see different people at Mass, so you don't really get to meet and grow with the same people — unlike the Mormon church, which felt more like a membership-based community (no fees, of course). Because of that, we got to know the people around us — there's an exclusive church and schedule for your area, and they have plenty of books beyond the Holy Bible, the main one being the Book of Mormon, which is claimed to be another testament of Jesus Christ. After weeks of learning these scriptures, my siblings and I were baptized as members of The Church of Jesus Christ of Latter-day Saints. They have a swimming pool-like basin inside the church, used exclusively for baptisms, where you get dipped while wearing plain white overalls and a white undergarment. It was also cool because they had a basketball court right beside the church, used for member fellowship, along with a stage inside used for events like Christmas presentations. I had a lot of fun and enjoyed being a member of this church more than my previous one — until COVID-19 hit the world. Everything went online: social distancing, online classes, TikTok, Facebook, Instagram, Mobile Legends, and other mobile games that made us addicted and disconnected from both physical and spiritual things.", "Oh, I forgot to mention the names of the schools I'm talking about. The first school I enrolled in in Davao was Our Lady of Fatima Academy — I know it's odd for a Catholic school to have so many Muslim students enrolled, and I felt the same way at first, but I guess it's normal, since 91% of the Philippine population is Christian and there are so many Catholic schools around. The second school, where I met Jim, was St. Patrick Math-Sci School — also Catholic. Most schools in the Philippines are named after saints, since of that 91% Christian population, 78.8% is Roman Catholic (my family included, before we became Mormons). That's because we were colonized by the Spanish for 333 years, which greatly influenced our religion, way of life, and language.", "After graduating senior high online in 2021, I enrolled in a college near our house for a Bachelor of Science in Criminology. I took the Advanced Army ROTC course — an optional military program that's really beneficial once completed. You can choose between Basic ROTC (one year) and Advanced ROTC (three years). We started as “plebes,” the lowest rank, where every order had to be followed without question. I met Jamaica, a Muslim girl who didn't wear a hijab, and I wondered why. It had been years since I'd been that close to a Muslim friend again, and we became best friends, classmates, and buddies until we graduated in 2025. When we started ROTC she was low-key, introverted, and quiet, but as I got to know her I found she actually had a pretty tough, no-nonsense personality. I found out she was from the Tausug tribe as well — Tausugs in Davao City are known for their bravery, and I believed it once I got to know her, especially when I became Corps Commander in our third year and she became my Executive Officer. We started with about 30 applicants for the Advanced ROTC course, but by third year, when we became the highest-ranking cadets, it was just me and Jamaica keeping our unit running.", "I noticed how she handled herself with our juniors — she was genuinely intimidating, and I admired her confidence and bravery. She was like a lion. I proposed that she take charge of disciplining our juniors, and she happily agreed; it worked well all the way through graduation. A year later, as we were finishing our bachelor's degrees, we became Criminology interns. I became Batch President and she remained my Executive Officer — same dynamic as our ROTC days. I'd tell her to discipline our more hard-headed fellow interns, since I couldn't really raise my voice at classmates, but she could. Eventually the time came for us to go our separate ways. On our graduation day, I saw her wearing a hijab for the first time — I learned she only wore it during major events.", "During my college years I also attended a Protestant church, having been introduced to it through my martial arts club, which was linked to the church because our grandmaster was a pastor. He comforted me during a rough patch with my family, particularly with my dad, and he was there for me during a depressive period. There was a time I hugged him and cried, and he prayed over me — it sounded like Latin, something like “Sha la la sha ba lu la la.” I later learned this is called “speaking in tongues,” a practice common during intense prayer or worship, especially among pastors. The words themselves don't have a literal meaning — it's meant to be a direct, emotional, spiritual communication between the believer's spirit and God, bypassing the logical mind, like emotion expressed through sound rather than words. So whenever someone asked, “Rex, what's your religion?” I'd always say, “Honestly, I'm not sure anymore.” I've attended a lot of churches and still visit some of them depending on who I'm with, since I've made friends through Catholic, Mormon, and Protestant communities, and depending on which church is closest to me at the time. It doesn't matter, as long as I can pray to God.", "Right after graduation, I flew out for a graduation gift from my aunt — originally meant to be a trip to Japan, but due to visa processing time, we booked Bali, Indonesia instead. I flew solo to Bali since my family had already been there a few days before my graduation, so I just caught up with them. When I landed at Denpasar Airport, I didn't see nearly as many people wearing hijabs as I expected, having read that Indonesia is a Muslim-majority country — I later learned Bali is mostly Hindu, which explained all the temples I saw on the Grab ride to our accommodation. A few days later we went to Jakarta, where I saw many more Muslims and hijabs. I had a lot of fun in Indonesia — my only struggle was the food, since I didn't understand most of the menu items and had to guess based on pictures, and if there weren't any, I'd just pick randomly and usually end up with something I didn't like.", "A month later, I passed the Air Force qualifying exam and went to Zamboanga City for further examinations. It felt similar to Jakarta, since that city also has a large Muslim population, and it also has a history of conflict — the Zamboanga Siege, a 21-day armed standoff between government forces and a rogue faction of the Moro National Liberation Front (MNLF). As the name suggests, the MNLF is a Muslim group. In the Philippines, armed conflicts are usually between the government and Islamic groups, and since many terrorists here have been Muslim, some Filipinos have developed discriminatory attitudes and fear toward Muslims in general — which is part of why some young Filipinos jokingly say “Allahu Akbar” when pretending to throw a grenade or making bomb jokes. That kind of joke is really insensitive and shouldn't be made at all. Young Filipinos shouldn't generalize all Muslims based on the actions of a few, and this is something that should be taught starting from grade school through college — from what I've seen, we're mostly taught how to be good followers of Christ, but not necessarily how to respect other religions. This reminds me of something from my time at OLFA in 8th grade: there was a specific day when all students, including Muslim students, were required to attend Catholic Mass. I hope that's not still a requirement — it's insensitive, and the school management is old enough to understand the meaning of respect.", "This history is part of why the Philippines has an autonomous Muslim region called BARMM, established in 2019 following the peace agreement with the Moro Islamic Liberation Front (MILF). BARMM has its own regional government based in Cotabato City and consists of six provinces and three independent local entities. These areas can seem intimidating to other Filipinos — there are rumors that offending someone there could get you killed, and that armed men in mismatched uniforms, from their own regional forces, are a common sight. I honestly don't know much about this firsthand, since I've never been to BARMM — I'm still a bit scared to go, mostly because of what I've seen on social media.", "Moving on — a year after graduation I was hired as the International Relations Officer of my alma mater, recommended by the institution's Research Director, who thought highly of me because of my research achievements under his mentorship. A month into the job, he sent me information about an international event called ASEMO that we should join to boost the institution's global visibility, since our Internationalization Office was still just getting started. So the time came, I prepared everything and the participants, and we went to Malaysia, where I again saw many Muslim people and even made friends with some of them — my first time meeting international Muslim college students. I thought they'd be different from us, but they turned out to be just like us. I met a girl named Nanum who also plays Valorant — I noticed her during our community extension program because she kept saying Filipino curse words she'd picked up from a fellow Filipino student from De La Salle University, and I just stood there laughing. Later, we ended up as bus seatmates on the way to the closing ceremony and talked mostly about Valorant. That was really the only proper conversation we had in person, but I could tell she was fun to be around. We also ended up on the same bus for the departure to UUM, though the organizers moved them to the upper deck — at least I got to talk to her in person one more time. We've kept in touch since the event, and I've learned a lot from her about Indonesian culture, language, and Muslim traditions in general. Being in Malaysia and Indonesia, both Muslim-majority countries, wasn't scary at all — it was actually a lot of fun, and nothing like how movies portray Muslims, nothing like the news back home, and nothing like what people say through gossip. I hope BARMM turns out to be the same when I eventually visit — still a little nervous about that one, though.", "I looked into why Malaysia and Indonesia are Muslim-majority countries, and it turns out the reason is similar to Mindanao's, since Mindanao is the Philippine island closest to those countries. Long-distance trade between locals and foreigners played a big role. Before Islam and Christianity arrived, people practiced animism — belief in local gods and goddesses, what we'd now call superstition, the kind of belief you see in movies where people make offerings to their gods. The same was true in Malaysia and Indonesia before those countries adopted their current religions. I also learned that Hinduism and Buddhism were largely reserved for the elite at the time, having arrived long before Islam. That's part of why Islam spread so easily throughout the region — it didn't require belonging to a particular class, and it was open to everyone.", "You shouldn't take everyone else's word for what a religion is — you should define it for yourself. Get close to people, become their friend, and enjoy their company. And I'm not just talking about Christians and Muslims here — this applies just as much between different Christian denominations, since we have so many different Christian traditions here in the Philippines, each with different practices and beliefs.", "Along the way, you'll meet people who use ugly words to describe someone else's religion just to convince you that theirs is the “real” one. We should let go of that mindset. We shouldn't try to win people over to our religion by tearing down someone else's, since we never really know what led them to their faith in the first place. Try to see other people's religion the way you see your own, and put yourself in their shoes.", "We're all just human. We all want friends. We all want somewhere we can feel comfortable and settled. We all just want to live a normal, peaceful life.", "In a world full of boundaries — seas, mountains, long roads — we gain many differences from each other. Just be a human who treats other people as human too — and don't limit that kindness to people alone; be good to everything.", "From someone who's been to many churches, and been exposed to many cultures and beliefs: when we choose respect over judgment, we honor our shared humanity."], "closing": ["I'll leave this here in two words:", "Be open.", "To God be the glory  |  Alhamdulillah", "— Rex"]}</script>
<script>
(function(){
  const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(init);

function init(){
  const DATA = JSON.parse(document.getElementById('book-data').textContent);

  /* ---------- build shelf ---------- */
  const grid = document.getElementById('shelf-grid');

  const realSlot = document.createElement('div');
  realSlot.className = 'book-slot';
  realSlot.innerHTML = `
    <div class="book-cover" id="cover-trigger" tabindex="0" role="button" aria-label="Open ${DATA.title}">
      <img src="data:image/jpeg;base64,${DATA.coverB64}" alt="${DATA.title} cover">
    </div>
    <div class="book-slot-label"><b>${DATA.title}</b>${DATA.subtitle}</div>
  `;
  grid.appendChild(realSlot);

  const ghostCount = 3;
  for(let i=0;i<ghostCount;i++){
    const g = document.createElement('div');
    g.className = 'book-slot empty';
    g.innerHTML = `
      <div class="book-ghost"><span class="plus">+</span></div>
      <div class="book-slot-label">Awaiting a new chapter</div>
    `;
    grid.appendChild(g);
  }

  /* ---------- paginate paragraphs into book pages ---------- */
  // Build a flat token stream: paragraph markers + words, then greedily
  // fill a hidden measuring page to find natural breakpoints.
  const PAGE_W = 340, PAGE_H = 498; // logical design size (also used at runtime, scaled)
  const CONTENT_PAD_TOP = 38+30, CONTENT_PAD_SIDE = 26, CONTENT_PAD_BOTTOM = 34+24;

  function buildMeasurer(){
    const m = document.createElement('div');
    m.style.position='fixed'; m.style.left='-9999px'; m.style.top='0';
    m.style.width = (PAGE_W - CONTENT_PAD_SIDE*2)+'px';
    m.style.fontFamily = "'Source Serif 4', serif";
    m.style.fontSize='12.6px'; m.style.lineHeight='1.62'; m.style.textAlign='justify';
    document.body.appendChild(m);
    return m;
  }

  function paginateParagraphs(paragraphs){
    const measurer = buildMeasurer();
    const maxH = PAGE_H - CONTENT_PAD_TOP - CONTENT_PAD_BOTTOM - 10;
    const pages = [];
    let currentHTML = '';
    let currentP = document.createElement('p');
    measurer.innerHTML = '';

    function pageHeight(){ return measurer.scrollHeight; }
    function commitPage(){
      pages.push(currentHTML);
      currentHTML='';
      measurer.innerHTML='';
    }

    paragraphs.forEach((text, pIdx) => {
      const words = text.split(' ');
      let pHTML = '<p>';
      let wroteAny = false;
      words.forEach((w) => {
        const test = pHTML + (wroteAny? ' ':'') + w;
        const testFull = measurer.innerHTML + currentHTML.slice(0,0); // noop safeguard
        // try adding word
        measurer.innerHTML = currentHTML + test + '</p>';
        if(pageHeight() > maxH){
          // revert: close current p (without this word), commit page, start new page with this word
          if(wroteAny){
            currentHTML += pHTML + '</p>';
          }
          commitPage();
          pHTML = '<p class="noindent">' + w;
          wroteAny = true;
          measurer.innerHTML = currentHTML + pHTML + '</p>';
        } else {
          pHTML = test;
          wroteAny = true;
        }
      });
      currentHTML += pHTML + '</p>';
      measurer.innerHTML = currentHTML;
    });
    if(currentHTML) pages.push(currentHTML);
    measurer.remove();
    return pages;
  }

  const bodyPages = paginateParagraphs(DATA.paragraphs);

  // closing lines as their own final page(s)
  const closingHTML =
    `<p class="center">${DATA.closing[0]}</p>` +
    `<p class="center italic" style="margin-top:18px;font-size:14px;">${DATA.closing[1]}</p>` +
    `<p class="center" style="margin-top:26px;">${DATA.closing[2]}</p>` +
    `<p class="center italic" style="margin-top:6px;">${DATA.closing[3]}</p>`;

  const PAGES = [{title:true}, ...bodyPages.map(h=>({body:h})), {body:closingHTML, isClosing:true}];

  /* ---------- reader state & rendering ---------- */
  let current = 0;
  const total = PAGES.length;

  const pageContentBase = document.getElementById('page-content-base');
  const leafFront = document.getElementById('leaf-front');
  const leafBack = document.getElementById('leaf-back');
  const leaf = document.getElementById('leaf');
  const pageIndicator = document.getElementById('page-indicator');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const edgeRight = document.getElementById('edge-right');
  const edgeLeft = document.getElementById('edge-left');

  function renderPageInner(idx){
    const pg = PAGES[idx];
    if(pg && pg.title){
      return `<div class="title-page">
        <div class="eyebrow">a personal essay</div>
        <h1>${DATA.title}</h1>
        <p>${DATA.subtitle}</p>
        <div class="by">${DATA.author}</div>
      </div>`;
    }
    const num = idx; // page number shown (0 = title, not numbered)
    return `<div class="running-head">${DATA.title.toUpperCase()}</div>
      <div class="ptext">${pg.body}</div>
      ${idx>0 ? `<div class="pnum">${idx}</div>` : ''}`;
  }

  function updateEdges(){
    const remaining = Math.max(0, total - current - 1);
    const read = current;
    const maxSpread = 22;
    const rWidth = Math.min(10, 3 + remaining*0.6);
    const lWidth = Math.min(10, 3 + read*0.6);
    edgeRight.style.opacity = remaining>0 ? 1 : 0;
    edgeLeft.style.opacity = read>0 ? 1 : 0;
    edgeRight.style.width = rWidth+'px';
    edgeLeft.style.width = lWidth+'px';
  }

  function setBase(idx){
    pageContentBase.innerHTML = renderPageInner(idx);
    leafFront.innerHTML = renderPageInner(idx); // leaf always mirrors the base until it flips
    updateEdges();
    pageIndicator.textContent = (idx+1)+' / '+total;
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===total-1;
  }

  let animating = false;

  function goNext(){
    if(animating || current>=total-1) return;
    animating = true;
    const next = current+1;
    leafBack.innerHTML = renderPageInner(next);
    requestAnimationFrame(()=>{
      leaf.classList.add('flip');
    });
    setTimeout(()=>{
      current = next;
      setBase(current);
      leaf.style.transition='none';
      leaf.classList.remove('flip');
      void leaf.offsetWidth;
      leaf.style.transition='';
      animating = false;
    }, 720);
  }

  function goPrev(){
    if(animating || current<=0) return;
    animating = true;
    const prev = current-1;
    leafBack.innerHTML = renderPageInner(prev);
    requestAnimationFrame(()=>{
      leaf.classList.add('flip-back');
    });
    setTimeout(()=>{
      current = prev;
      setBase(current);
      leaf.style.transition='none';
      leaf.classList.remove('flip-back');
      void leaf.offsetWidth;
      leaf.style.transition='';
      animating = false;
    }, 720);
  }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);
  document.addEventListener('keydown', (e)=>{
    if(!document.getElementById('reader-view').classList.contains('active')) return;
    if(e.key==='ArrowRight') goNext();
    if(e.key==='ArrowLeft') goPrev();
    if(e.key==='Escape') closeReader();
  });

  /* ---------- responsive scale ---------- */
  const bookStage = document.getElementById('book-stage');
  function rescale(){
    const availW = window.innerWidth * 0.86;
    const availH = window.innerHeight * 0.72;
    const scale = Math.min(availW/PAGE_W, availH/PAGE_H, 1.3);
    bookStage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', rescale);
  rescale();

  /* ---------- zoom-open transition ---------- */
  const shelfView = document.getElementById('shelf-view');
  const readerView = document.getElementById('reader-view');
  const zoomGhost = document.getElementById('zoom-ghost');
  const zoomGhostImg = document.getElementById('zoom-ghost-img');
  const coverTrigger = document.getElementById('cover-trigger');

  function openReader(){
    const rect = coverTrigger.getBoundingClientRect();
    zoomGhostImg.src = coverTrigger.querySelector('img').src;
    zoomGhost.style.left = rect.left+'px';
    zoomGhost.style.top = rect.top+'px';
    zoomGhost.style.width = rect.width+'px';
    zoomGhost.style.height = rect.height+'px';
    zoomGhost.style.opacity = '1';
    zoomGhost.style.transition = 'none';
    void zoomGhost.offsetWidth;

    // target: centered book-stage rect
    rescale();
    const target = document.getElementById('book-stage').getBoundingClientRect();

    zoomGhost.style.transition = 'left .6s cubic-bezier(.2,.8,.2,1), top .6s cubic-bezier(.2,.8,.2,1), width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1), opacity .35s ease .3s';
    requestAnimationFrame(()=>{
      zoomGhost.style.left = target.left+'px';
      zoomGhost.style.top = target.top+'px';
      zoomGhost.style.width = target.width+'px';
      zoomGhost.style.height = target.height+'px';
    });

    shelfView.classList.add('hidden');
    setBase(0);
    current = 0;
    document.getElementById('reader-title-chip').textContent = DATA.title;

    setTimeout(()=>{
      readerView.classList.add('active');
      readerView.setAttribute('aria-hidden','false');
      zoomGhost.style.opacity='0';
    }, 560);
  }

  function closeReader(){
    readerView.classList.remove('active');
    readerView.setAttribute('aria-hidden','true');
    shelfView.classList.remove('hidden');
  }

  coverTrigger.addEventListener('click', openReader);
  coverTrigger.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openReader(); }});
  document.getElementById('close-btn').addEventListener('click', closeReader);

} // end init
})();
</script>
</body>
</html>
